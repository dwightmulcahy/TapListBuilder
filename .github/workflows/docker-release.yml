name: Build and Push to Docker Hub

on:
  push:
    branches: [release]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-check.outputs.version }}
      is_latest: ${{ steps.release-check.outputs.is-latest }}
      publish_major: ${{ steps.aliases.outputs.publish_major }}
      publish_minor: ${{ steps.aliases.outputs.publish_minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check JavaScript and JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find js -name '*.js' -print0)
          while IFS= read -r -d '' f; do node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f"; done < <(find data -name '*.json' -print0)
      - name: Validate SemVer tag and release ancestry
        if: startsWith(github.ref, 'refs/tags/')
        id: release-check
        uses: dwightmulcahy/repo-template/.github/actions/validate-release@f3dc1af2146156866574485a20ded5ac35d08a88
        with:
          tag: ${{ github.ref_name }}
          branch: release


      - name: Determine version-line Docker aliases
        if: startsWith(github.ref, 'refs/tags/')
        id: aliases
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          current="${GITHUB_REF_NAME#v}"
          major="${current%%.*}"
          minor="${current%.*}"
          versions="$(git tag --list | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')"
          highest_major="$(printf '%s\n' "$versions" | awk -F. -v m="$major" '$1==m' | sort -V | tail -n 1)"
          highest_minor="$(printf '%s\n' "$versions" | awk -F. -v m="$major" -v n="${minor#*.}" '$1==m && $2==n' | sort -V | tail -n 1)"
          echo "publish_major=$([[ "$current" == "$highest_major" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "publish_minor=$([[ "$current" == "$highest_minor" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build-and-push:
    if: github.ref == 'refs/heads/release'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build metadata
        id: vars
        shell: bash
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/taplistbuilder
          flavor: latest=false
          tags: |
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=release,enable=${{ github.ref == 'refs/heads/release' }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
            BUILD_DATE=${{ steps.vars.outputs.date }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-tag:
    name: Publish tagged Docker image
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    uses: dwightmulcahy/repo-template/.github/workflows/reusable-docker-publish.yml@0ecc636387ef04b46acf232b3a9ef49cc2980eca
    with:
      image: dwightmulcahy/taplistbuilder
      tag: ${{ github.ref_name }}
      publish_major: ${{ needs.validate.outputs.publish_major == 'true' }}
      publish_minor: ${{ needs.validate.outputs.publish_minor == 'true' }}
      publish_latest: ${{ needs.validate.outputs.is_latest == 'true' }}
      build_args: |
        APP_VERSION=${{ needs.validate.outputs.version }}
        VCS_REF=${{ github.sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, publish-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate conventional release notes
        uses: dwightmulcahy/repo-template/.github/actions/release-notes@f3dc1af2146156866574485a20ded5ac35d08a88
        with:
          tag: ${{ github.ref_name }}
          project-name: "TapListBuilder"
          image: "dwightmulcahy/taplistbuilder"
          output: "release-notes.md"
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md
          fi
