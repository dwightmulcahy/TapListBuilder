name: CI
on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check JavaScript and JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find js -name '*.js' -print0)
          while IFS= read -r -d '' f; do node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f"; done < <(find data -name '*.json' -print0)
      - name: Run Node unit tests
        run: node --test tests/*.test.cjs

  docker-smoke:
    name: Shared Docker build verification
    uses: dwightmulcahy/repo-template/.github/workflows/reusable-docker-smoke.yml@1b2a8ace955cd3a6d0641017aa8e4d621a183c21
    with:
      image: taplistbuilder:ci
      smoke-command: |
        docker build --build-arg APP_VERSION=9.8.7 --build-arg VCS_REF=0123456789abcdef -t taplistbuilder:metadata .
        docker run --rm --entrypoint cat taplistbuilder:metadata /usr/share/nginx/html/version.json | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const v=JSON.parse(s);if(v.version!=="9.8.7"||v.sha!=="0123456789abcdef"||!v.buildDate)process.exit(1)})'

  browser-coverage:
    name: Browser V8 coverage smoke
    runs-on: ubuntu-latest
    # Pin the browser runtime to its matching OS image. GitHub's latest host
    # currently uses Ubuntu 26.04, unsupported by older Playwright installers.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Run instrumented browser tests
        run: npm run test:coverage
      - name: Enforce measured browser coverage floor
        run: npm run coverage:check
      - name: Publish browser coverage in job summary
        if: always()
        run: node scripts/publish-coverage-summary.cjs
      - name: Upload browser coverage HTML, LCOV, and JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
