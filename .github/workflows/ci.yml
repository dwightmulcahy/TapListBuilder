name: CI
on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find js -name '*.js' -print0)
          while IFS= read -r -d '' f; do node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f"; done < <(find data -name '*.json' -print0)
      - name: Build Docker image (without publishing)
        run: docker build -t taplistbuilder:ci .
